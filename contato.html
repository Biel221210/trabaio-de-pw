<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Sonho - Contato</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="sonho.html">Sonho</a></li>
                <li><a href="hoje.html">Hoje</a></li>
                <li><a href="futuro.html">Futuro</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contato</h1>
        <p>Entre em contato preenchendo o formulário abaixo.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="avaliacao">Sua Avaliação:</label>
                <select id="avaliacao" name="avaliacao" required>
                    <option value="" disabled selected>Selecione uma nota...</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="comentario">Campo Comentário:</label>
                <textarea id="comentario" name="comentario" rows="5" placeholder="Deixe aqui seu comentário." required></textarea>
            </div>
            
            <button type="submit">Enviar Avaliação</button>
        </form>
    </main>
    <!-- Rodapé como orientado -->
    <footer>
        <p>&copy; 2026 - Atividade de PWI - Desenvolvido por Gabriel de Paula Buso</p>
    </footer>
</body>
</html>
